route:
  receiver: mailpit
  group_by: ["alertname", "job"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h

receivers:
  - name: mailpit
    email_configs:
      - to: "ops@weather.local"
        from: "alertmanager@weather.local"
        smarthost: "mailpit:1025"
        require_tls: false
        send_resolved: true

inhibit_rules:
  - source_matchers: ["severity=critical"]
    target_matchers: ["severity=warning"]
    equal: ["alertname", "instance"]
