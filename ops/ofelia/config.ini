# Nightly logical backup of the weather database (runs inside the backup container).
[job-exec "pg-backup"]
schedule = 0 3 * * *
container = weather-backup
command = /backup/backup.sh
no-overlap = true

# Every 30 min, enqueue a cache pre-warm job onto the RQ queue (demonstrates
# the scheduler -> queue -> worker pipeline).
[job-exec "prewarm-enqueue"]
schedule = */30 * * * *
container = weather-worker
command = python -m worker.producer
no-overlap = true
